
name: Build Friday APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate FridayPro project
        shell: bash
        run: |
          if [ -d "FridayPro" ]; then
            PROJECT_DIR="FridayPro"

          elif [ -f "FridayPro.zip" ]; then
            mkdir -p extracted
            unzip -qo FridayPro.zip -d extracted

            PROJECT_DIR=$(find extracted \
              -name settings.gradle.kts \
              -not -path '*/.gradle/*' \
              -printf '%h\n' | head -n1)

          elif [ -f "FridayPro" ]; then
            mkdir -p extracted
            unzip -qo FridayPro -d extracted

            PROJECT_DIR=$(find extracted \
              -name settings.gradle.kts \
              -not -path '*/.gradle/*' \
              -printf '%h\n' | head -n1)
          else
            echo "FridayPro project not found!"
            exit 1
          fi

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build Friday APK
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          set -o pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee build.log

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          cp "$APK" Friday.apk

          echo "APK successfully generated!"

      - name: Upload Friday APK
        uses: actions/upload-artifact@v4
        with:
          name: Friday-apk
          path: ${{ env.PROJECT }}/Friday.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "$PROJECT/Friday.apk" \
            --title "Friday build ${{ github.run_number }}" \
            --notes "Download Friday.apk to install Friday."
