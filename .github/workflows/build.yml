name: Build Friday APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "Friday (1).zip"
      - name: Fix Voice.kt
        run: |
          cat > Friday/app/src/main/java/com/friday/app/Voice.kt <<'EOF'
          package com.friday.app
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech

          class Voice(private val ctx: Context, private val onHeard: (String) -> Unit) {
              private var ready = false
              private val tts: TextToSpeech = TextToSpeech(ctx) { s -> ready = (s == TextToSpeech.SUCCESS) }
              private val sr: SpeechRecognizer = SpeechRecognizer.createSpeechRecognizer(ctx)

              fun speak(t: String) { if (ready) tts.speak(t, TextToSpeech.QUEUE_ADD, null, "f") }

              fun listen() {
                  sr.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(r: Bundle) { r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.let(onHeard) }
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(e: Int) {}
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}
                  })
                  sr.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                  })
              }
              fun stop() { sr.destroy(); tts.shutdown() }
          }
          EOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        working-directory: Friday
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |What went wrong|error:" -A4 build.log | head -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        with: { name: Friday-apk, path: Friday/app/build/outputs/apk/debug/app-debug.apk }
