
name: Build Friday APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack FridayPro
        run: |
          if [ -f FridayPro.zip ]; then
            ZIP_FILE="FridayPro.zip"
          else
            ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found!"
            exit 1
          fi

          unzip -qo "$ZIP_FILE"

          PROJECT_DIR=$(find . -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -printf '%h\n' | head -n1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found!"
            exit 1
          fi

          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Friday APK
        working-directory: ${{ env.PROJECT }}
        run: |
          set -o pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee build.log

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          cp "$APK" Friday.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Friday-apk
          path: ${{ env.PROJECT }}/Friday.apk
          retention-days: 14

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "$PROJECT/Friday.apk" \
            --title "Friday build ${{ github.run_number }}" \
            --notes "Download Friday.apk to install Friday."
