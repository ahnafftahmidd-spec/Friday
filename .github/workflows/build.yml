
name: Build Friday APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          if [ -f FridayPro.zip ]; then
            zip=FridayPro.zip
          else
            zip=$(ls *.zip | head -n1)
          fi

          unzip -qo "$zip"

          dir=$(find . -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n1)

          if [ -z "$dir" ]; then
            echo "Could not find settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT=$dir" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          set +e

          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?

          if [ $code -ne 0 ]; then
            echo "## Build failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            grep -E \
              "Caused by|Unsupported|major version|^e: |What went wrong|error:" \
              -A3 build.log | head -70 >> "$GITHUB_STEP_SUMMARY"

            echo '```' >> "$GITHUB_STEP_SUMMARY"

            cat build.log
          fi

          if [ $code -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Friday.apk
          fi

          exit $code

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "$PROJECT/Friday.apk" \
            --title "Friday build ${{ github.run_number }}" \
            --notes "Download Friday.apk and tap it to install."
